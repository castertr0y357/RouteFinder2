{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div class="card" style="padding: 2.5rem;">
    <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">Route Planner</h2>
    <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem;">Build your Saturday morning itinerary. Add addresses manually or from the <a href="{% url 'discover' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 700;">Discover Tab</a>.</p>
    
    <form method="post" action="{% url 'main' %}">
        {% csrf_token %}
        
        <div style="margin-bottom: 2.5rem;">
            <label>Starting Base</label>
            <div style="position: relative;">
                <input type="text" name="start_address" value="{{ start_address|default:'' }}" required placeholder="Your Home/Hotel Address" style="padding-left: 3rem; margin-bottom: 0;">
                <span style="position: absolute; left: 1.15rem; top: 0.85rem; font-size: 1.1rem; filter: grayscale(1);">🏠</span>
            </div>
        </div>

        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-end;">
            <label style="margin-bottom: 0;">Itinerary Destinations</label>
            <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Priority (1+ = Fixed Order)</span>
        </div>
        
        <div id="destinations-container" style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- dynamic rows injected by JS -->
        </div>

        <button type="button" id="addStopBtn" style="background: rgba(99, 102, 241, 0.05); color: var(--primary-color); border: 2px dashed rgba(99, 102, 241, 0.2); margin-bottom: 2.5rem; box-shadow: none; font-size: 0.9rem; padding: 1rem;">+ Add Manual Location</button>

        <div style="background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border-color); margin-bottom: 2.5rem;">
            <h3 style="font-size: 0.9rem; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Optimization Variables</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Start Departure</label>
                    <input type="text" name="start_time" value="{{ start_time|default:'08:00' }}" placeholder="08:00" style="margin-bottom: 0;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Average Mins / Stop</label>
                    <input type="number" name="stop_mins" value="{{ stop_mins|default:'15' }}" style="margin-bottom: 0;">
                </div>
            </div>
        </div>

        <input type="submit" value="Generate Intelligent Route" style="font-size: 1.1rem; padding: 1.25rem; background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));">
    </form>
</div>

<script>
    const initialAddressesRaw = '{{ other_addresses_json|escapejs }}';
    const container = document.getElementById('destinations-container');
    const addBtn = document.getElementById('addStopBtn');
    
    function addRow(addressValue = '', priorityValue = '0', typeValue = 'garage') {
        const row = document.createElement('div');
        row.className = 'animate-in';
        row.style.display = 'flex';
        row.style.gap = '0.75rem';
        
        row.innerHTML = `
            <div style="flex: 1; position: relative;">
               <input type="text" name="address[]" value="${addressValue.replace(/"/g, '&quot;')}" required placeholder="Sale Address" style="margin-bottom: 0; padding-left: 1rem;">
               <input type="hidden" name="type[]" value="${typeValue}">
            </div>
            <input type="number" name="priority[]" value="${priorityValue}" min="0" style="width: 70px; text-align: center; margin-bottom: 0; font-weight: 700;">
            <button type="button" onclick="this.parentElement.remove()" style="background: rgba(239, 68, 68, 0.1); color: var(--bust-color); width: 45px; padding: 0.5rem; border-radius: 0.75rem; box-shadow: none; font-size: 1.25rem;">&times;</button>
        `;
        container.appendChild(row);
    }
    
    try {
        if (initialAddressesRaw && initialAddressesRaw !== 'null' && initialAddressesRaw !== '') {
            let safeJsonStr = initialAddressesRaw.replace(/'/g, '"');
            const data = JSON.parse(safeJsonStr);
            if (Array.isArray(data)) {
                data.forEach(item => {
                    if (typeof item === 'string') {
                        addRow(item, 0, 'garage');
                    } else if (item.address) {
                        addRow(item.address, item.priority || 0, item.type || 'garage');
                    }
                });
            }
        } else {
             // add 2 empty rows by default if no data
             addRow();
             addRow();
        }
    } catch(e) {
        console.error("JSON Parse Error on Initial Addresses:", e);
        addRow();
    }
    
    addBtn.addEventListener('click', () => addRow());
</script>
{% endblock %}
