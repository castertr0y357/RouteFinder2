{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div class="card" style="padding: 2.5rem;">
    <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">Route Planner</h2>
    <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem;">Build your Saturday morning itinerary. Add addresses manually or from the <a href="{% url 'discover' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 700;">Discover Tab</a>.</p>
    
    <form method="post" action="{% url 'main' %}">
        {% csrf_token %}
        
        <div style="margin-bottom: 2.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
                <label style="margin-bottom: 0;">Starting Base</label>
                <button type="button" id="use-home-location-btn" style="background: transparent; border: none; color: var(--primary-color); font-size: 0.75rem; font-weight: 700; cursor: pointer; padding: 0; box-shadow: none; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.25rem;">📍 Use Current Location</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="start_address_input" name="start_address" value="{{ start_address|default:'' }}" required placeholder="Your Home/Hotel Address" style="padding-left: 3rem; margin-bottom: 0;">
                <span style="position: absolute; left: 1.15rem; top: 0.85rem; font-size: 1.1rem; filter: grayscale(1);">🏠</span>
            </div>
        </div>

        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-end;">
            <label style="margin-bottom: 0;">Itinerary Destinations</label>
            <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">Priority (1+ = Fixed Order)</span>
        </div>
        
        <div id="destinations-container" style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <!-- dynamic rows injected by JS -->
        </div>

        <div style="display: flex; gap: 0.75rem; margin-bottom: 2.5rem;">
            <button type="button" id="addStopBtn" style="flex: 2; background: rgba(99, 102, 241, 0.05); color: var(--primary-color); border: 2px dashed rgba(99, 102, 241, 0.2); box-shadow: none; font-size: 0.9rem; padding: 1rem;">+ Add Manual Location</button>
            <button type="button" id="clearRouteBtn" style="flex: 1; background: rgba(239, 68, 68, 0.05); color: var(--bust-color); border: 1px solid rgba(239, 68, 68, 0.2); box-shadow: none; font-size: 0.85rem; padding: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Clear All</button>
        </div>

        <div style="background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border-color); margin-bottom: 2.5rem;">
            <h3 style="font-size: 0.9rem; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Optimization Variables</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Start Departure</label>
                    <input type="text" name="start_time" value="{{ start_time|default:'08:00' }}" placeholder="08:00" style="margin-bottom: 0;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Average Mins / Stop</label>
                    <input type="number" name="stop_mins" value="{{ stop_mins|default:'15' }}" style="margin-bottom: 0;">
                </div>
            </div>
        </div>

        <input type="submit" value="Generate Intelligent Route" style="font-size: 1.1rem; padding: 1.25rem; background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));">
    </form>
</div>

<script>
    const initialAddressesRaw = '{{ other_addresses_json|escapejs }}';
    const container = document.getElementById('destinations-container');
    const addBtn = document.getElementById('addStopBtn');
    
    function addRow(itemData = {}) {
        let addressValue = "";
        let priorityValue = "0";
        let typeValue = "garage";
        let title = "";
        let desc = "";
        let tags = "";
        let is_treasure = "false";
        let treasure_reason = "";
        let is_wishlist_match = "false";
        let match_reason = "";

        if (typeof itemData === 'string') {
            addressValue = itemData;
        } else {
            addressValue = itemData.address || "";
            priorityValue = itemData.priority || "0";
            typeValue = itemData.type || "garage";
            title = itemData.title || "";
            desc = itemData.desc || "";
            tags = JSON.stringify(itemData.tags || []);
            is_treasure = itemData.is_treasure ? "true" : "false";
            treasure_reason = itemData.treasure_reason || "";
            is_wishlist_match = itemData.is_wishlist_match ? "true" : "false";
            match_reason = itemData.match_reason || "";
        }

        const row = document.createElement('div');
        row.className = 'animate-in';
        row.style.display = 'flex';
        row.style.gap = '0.75rem';
        
        row.innerHTML = `
            <div style="flex: 1; position: relative;">
               <input type="text" name="address[]" value="${addressValue.replace(/"/g, '&quot;')}" required placeholder="Sale Address" style="margin-bottom: 0; padding-left: 1rem;">
               <input type="hidden" name="type[]" value="${typeValue}">
               <input type="hidden" name="title[]" value="${title.replace(/"/g, '&quot;')}">
               <input type="hidden" name="desc[]" value="${desc.replace(/"/g, '&quot;')}">
               <input type="hidden" name="tags[]" value='${tags.replace(/'/g, "&#39;")}'>
               <input type="hidden" name="is_treasure[]" value="${is_treasure}">
               <input type="hidden" name="treasure_reason[]" value="${treasure_reason.replace(/"/g, '&quot;')}">
               <input type="hidden" name="is_wishlist_match[]" value="${is_wishlist_match}">
               <input type="hidden" name="match_reason[]" value="${match_reason.replace(/"/g, '&quot;')}">
            </div>
            <input type="number" name="priority[]" value="${priorityValue}" min="0" style="width: 70px; text-align: center; margin-bottom: 0; font-weight: 700;">
            <button type="button" onclick="removeAddress('${addressValue.replace(/"/g, '&quot;')}', this.parentElement)" style="background: rgba(239, 68, 68, 0.1); color: var(--bust-color); width: 45px; padding: 0.5rem; border-radius: 0.75rem; box-shadow: none; font-size: 1.25rem;">&times;</button>
        `;
        container.appendChild(row);
    }

    async function removeAddress(address, element) {
        // Remove from UI immediately for responsiveness
        element.remove();
        
        // If it was just an empty row, don't bother the server
        if (!address) return;

        try {
            await fetch('{% url "remove_address" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ address: address })
            });
        } catch (error) {
            console.error('Error removing address:', error);
        }
    }
    
    try {
        if (initialAddressesRaw && initialAddressesRaw !== 'null' && initialAddressesRaw !== '') {
            const data = JSON.parse(initialAddressesRaw);
            if (Array.isArray(data)) {
                data.forEach(item => {
                    addRow(item);
                });
            }
        } else {
             // add 2 empty rows by default if no data
             addRow();
             addRow();
        }
    } catch(e) {
        console.error("JSON Parse Error on Initial Addresses:", e);
        addRow();
    }
    
    addBtn.addEventListener('click', () => addRow());

    const clearBtn = document.getElementById('clearRouteBtn');
    if (clearBtn) {
        clearBtn.addEventListener('click', async () => {
            if (confirm('Are you sure you want to clear your entire route?')) {
                // Clear UI
                container.innerHTML = '';
                addRow(); // Add one empty row back for convenience
                
                // Clear Server Session
                try {
                    await fetch('{% url "clear_route" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        }
                    });
                } catch (error) {
                    console.error('Error clearing route:', error);
                }
            }
        });
    }
    // Use My Location Logic
    const homeLocBtn = document.getElementById('use-home-location-btn');
    const startInput = document.getElementById('start_address_input');

    if (homeLocBtn) {
        homeLocBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            const originalText = homeLocBtn.innerHTML;
            homeLocBtn.innerHTML = '⏳ Locating...';
            homeLocBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    try {
                        const response = await fetch('{% url "get_address" %}', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': '{{ csrf_token }}'
                            },
                            body: JSON.stringify({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            })
                        });
                        
                        const data = await response.json();
                        if (data.success) {
                            startInput.value = data.address;
                        } else {
                            alert(data.error || 'Could not determine address for this location.');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error communicating with the server.');
                    } finally {
                        homeLocBtn.disabled = false;
                        homeLocBtn.innerHTML = originalText;
                    }
                },
                (error) => {
                    alert('Error getting location: ' + error.message);
                    homeLocBtn.disabled = false;
                    homeLocBtn.innerHTML = originalText;
                }
            );
        });
    }
</script>
{% endblock %}
