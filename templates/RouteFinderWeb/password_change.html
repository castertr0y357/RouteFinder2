{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card" style="padding: 2.5rem;">
        <h2 style="margin-bottom: 0.5rem; text-align: center;">Update Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem; text-align: center; font-size: 0.95rem;">Enter your current password and your new credentials below.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <div style="margin-top: 1.5rem;">
                <input type="submit" value="Change Password" style="padding: 1rem; font-weight: 700;">
            </div>
        </form>
        
        <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <a href="{% url 'profile' %}" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;">&larr; Return to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
