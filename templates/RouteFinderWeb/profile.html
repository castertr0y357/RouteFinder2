{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card" style="padding: 2.5rem;">
        <h2 style="margin-bottom: 2rem; font-size: 1.5rem;">Your Profile</h2>
        <form method="post" action="{% url 'profile' %}">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <div style="margin-top: 2rem;">
                <input type="submit" value="Update Profile" style="padding: 1rem; font-weight: 700;">
            </div>
        </form>
        
        <div style="margin-top: 2.5rem; padding-top: 2.5rem; border-top: 1px solid var(--border-color); text-align: center;">
            <a href="{% url 'password_change' %}" style="display: block; background: rgba(255,255,255,0.05); color: white; padding: 1rem; border-radius: 0.75rem; text-decoration: none; font-weight: 700; border: 1px solid var(--border-color); transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                🔐 Manage Security & Password
            </a>
        </div>
        
        <div style="margin-top: 2rem; text-align: center;">
            <a href="{% url 'main' %}" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;">&larr; Return to Planner</a>
        </div>
    </div>
</div>
{% endblock %}
