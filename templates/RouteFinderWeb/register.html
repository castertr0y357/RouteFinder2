{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div class="card">
    <h2>Register</h2>
    <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <div style="margin-top: 1rem;">
            <input type="submit" value="Register">
        </div>
    </form>
    <p style="margin-top: 1rem; text-align: center;">Already have an account? <a href="{% url 'login' %}">Log In</a></p>
</div>
{% endblock %}
