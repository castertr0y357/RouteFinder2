{% extends "RouteFinderWeb/base.html" %}

{% block content %}
<div class="card" style="padding: 1.5rem; margin-bottom: 2.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2>Optimized Itinerary</h2>
        <div id="route-status" style="font-size: 0.85rem; background: rgba(16, 185, 129, 0.1); color: var(--garage-color); padding: 0.35rem 0.75rem; border-radius: 99px; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.2);">
            CALCULATING...
        </div>
    </div>
    
    <!-- MAP CONTAINER -->
    <div id="map" style="height: 450px; width: 100%; border-radius: 1.25rem; margin: 1.5rem 0; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.4); background: #1a1a1a;"></div>
    
    <div id="route-loading-state" style="text-align: center; padding: 4rem 2rem;">
        <div class="spinner" style="width: 3rem; height: 3rem; border-width: 4px; margin: 0 auto 1.5rem auto;"></div>
        <h3 style="margin-bottom: 0.5rem; color: white;">Optimizing Your Morning...</h3>
        <p style="color: var(--text-muted);">Solving the Traveling Salesman problem for your route.</p>
    </div>

    <div id="itinerary-container" style="display: none;">
        <div id="itinerary-list" style="padding-left: 0; margin-bottom: 2.5rem;">
            <!-- Steps will be injected here -->
        </div>
        
        <div id="navigation-links" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem;">
            <!-- Nav links will be injected here -->
        </div>
    </div>
    
    <div id="route-error" style="display: none; text-align: center; padding: 4rem 2rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">❌</div>
        <h3 id="error-message">Route Generation Failed</h3>
        <a href="{% url 'main' %}" style="display: inline-block; margin-top: 1.5rem; color: var(--primary-color);">Return to Route Planner</a>
    </div>

    <div style="margin-top: 3rem; text-align: center;">
        <a href="{% url 'main' %}" style="color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.95rem;">&larr; SCRAP THE ITINERARY & START OVER</a>
    </div>
</div>

<script>
let globalRouteData = null;
let googleMapsLoaded = false;

function onGoogleMapsReady() {
    googleMapsLoaded = true;
    if (globalRouteData) {
        renderMap(globalRouteData);
    }
}

document.addEventListener('DOMContentLoaded', async function() {
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

    try {
        const response = await fetch("{% url 'route_data' %}");
        const data = await response.json();
        
        if (data.success) {
            globalRouteData = data;
            document.getElementById('route-loading-state').style.display = 'none';
            document.getElementById('itinerary-container').style.display = 'block';
            document.getElementById('route-status').innerText = 'ACTIVE ROUTE';
            
            renderItinerary(data.itinerary);
            renderNavLinks(data.google_maps_urls);
            
            if (googleMapsLoaded) {
                renderMap(data);
            }
        } else {
            showError(data.error || 'Unknown error occurred during optimization.');
        }
    } catch (error) {
        console.error('Error fetching route data:', error);
        showError('Network error while calculating route.');
    }
});

function showError(msg) {
    document.getElementById('route-loading-state').style.display = 'none';
    document.getElementById('route-error').style.display = 'block';
    document.getElementById('error-message').innerText = msg;
}

function renderItinerary(itinerary) {
    const list = document.getElementById('itinerary-list');
    itinerary.forEach((step, index) => {
        const card = document.createElement('div');
        card.className = 'card step-card';
        const isFirst = index === 0;
        const isLast = index === itinerary.length - 1;
        
        let borderColor = 'var(--primary-color)';
        if (step.rating === 'bust') borderColor = 'var(--bust-color)';
        else if (step.rating === 'great') borderColor = 'var(--great-color)';
        else if (isFirst) borderColor = 'var(--garage-color)';
        else if (isLast) borderColor = '#f97316';

        card.style.cssText = `margin-bottom: 1rem; padding: 1.25rem; background: rgba(30, 41, 59, 0.4); border-left: 6px solid ${borderColor}; position: relative; overflow: hidden;`;
        
        let metaHtml = '';
        if (!isFirst && !isLast && (step.desc || step.tags.length > 0)) {
            metaHtml = `
                <details style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.75rem;">
                    <summary style="font-size: 0.75rem; color: var(--primary-color); cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">View Listing Details</summary>
                    <div style="padding-top: 0.75rem;">
                        ${step.title ? `<h4 style="margin: 0 0 0.5rem 0; font-size: 1rem;">${step.title}</h4>` : ''}
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">${step.desc}</p>
                        <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
                            ${(step.tags || []).map(tag => `<span class="ai-tag" style="background: rgba(99, 102, 241, 0.1); color: var(--primary-color); font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid rgba(99, 102, 241, 0.2);">${tag}</span>`).join('')}
                        </div>
                        ${step.is_treasure ? `<p style="font-size: 0.75rem; color: #fbbf24; margin-top: 0.5rem;">✨ AI: ${step.treasure_reason}</p>` : ''}
                        ${step.is_wishlist_match ? `<p style="font-size: 0.75rem; color: #10b981; margin-top: 0.25rem;">🎯 MATCH: ${step.match_reason}</p>` : ''}
                    </div>
                </details>
            `;
        }

        card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="flex: 1;">
                    <div style="font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem;">
                        ${step.address}
                    </div>
                </div>
                ${(!isFirst && !isLast) ? `
                <div style="display: flex; gap: 0.25rem;" class="rating-controls" data-address="${step.address}">
                   <button type="button" class="btn-rate btn-great" onclick="toggleRating('${step.address}', 'great', this)" style="background:rgba(251, 191, 36, 0.1); border:none; cursor:pointer; padding: 0.4rem; border-radius: 6px; font-size: 1.2rem; opacity: ${step.rating === 'great' ? '1' : '0.3'};">⭐</button>
                   <button type="button" class="btn-rate btn-bust" onclick="toggleRating('${step.address}', 'bust', this)" style="background:rgba(239, 68, 68, 0.1); border:none; cursor:pointer; padding: 0.4rem; border-radius: 6px; font-size: 1.2rem; opacity: ${step.rating === 'bust' ? '1' : '0.3'};">❌</button>
                </div>` : ''}
            </div>
            
            ${metaHtml}

            <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;">
                ${isFirst ? '<span style="color: var(--garage-color);">🏁 STARTING BASE</span>' : 
                  isLast ? '<span style="color: #f97316;">🏡 RETURN HOME</span>' : 
                  `<span style="display: flex; align-items: center; gap: 0.35rem;"><span style="color: var(--primary-color);">🚗</span> ${step.drive_time_str} DRIVE</span>`}
                
                <span style="display: flex; align-items: center; gap: 0.35rem;"><span>🕒</span> ARRIVE: <span style="color: white;">${step.arrival_time}</span></span>
                ${!isLast ? `<span style="display: flex; align-items: center; gap: 0.35rem;"><span>⌛</span> DEPART: <span style="color: white;">${step.departure_time}</span></span>` : ''}
            </div>
        `;
        list.appendChild(card);
    });
}

function renderNavLinks(urls) {
    const container = document.getElementById('navigation-links');
    urls.forEach(url => {
        const a = document.createElement('a');
        a.href = url.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.cssText = 'display: block; text-align: center; background: var(--primary-color); color: white; padding: 1rem; border-radius: 0.75rem; text-decoration: none; font-weight: 700; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); border: 1px solid rgba(255,255,255,0.1);';
        a.innerText = `🔗 Launch Navigation: ${url.label}`;
        container.appendChild(a);
    });
}

async function toggleRating(address, targetRating, btn) {
    const isActive = btn.style.opacity === "1";
    const newRating = isActive ? 'neutral' : targetRating;
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;

    try {
        const res = await fetch("{% url 'toggle_rating' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
            body: JSON.stringify({ address: address, rating: newRating })
        });
        if (res.ok) {
            const container = btn.closest('.rating-controls');
            container.querySelector('.btn-great').style.opacity = (newRating === 'great') ? '1' : '0.3';
            container.querySelector('.btn-bust').style.opacity = (newRating === 'bust') ? '1' : '0.3';
        }
    } catch(err) { console.error("Rating sync failed", err); }
}

function renderMap(data) {
    const mapContainer = document.getElementById("map");
    const map = new google.maps.Map(mapContainer, {
        zoom: 12,
        center: { lat: 37.0902, lng: -95.7129 },
        styles: [
            { "elementType": "geometry", "stylers": [{ "color": "#0f171c" }] },
            { "elementType": "labels.text.stroke", "stylers": [{ "color": "#0f171c" }] },
            { "elementType": "labels.text.fill", "stylers": [{ "color": "#746855" }] },
            { "featureType": "administrative.locality", "elementType": "labels.text.fill", "stylers": [{ "color": "#d59563" }] },
            { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#1e293b" }] },
            { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#06090c" }] }
        ]
    });
    
    const directionsService = new google.maps.DirectionsService();
    const directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        suppressMarkers: true,
        polylineOptions: { strokeColor: "#6366f1", strokeWeight: 6, strokeOpacity: 0.8 }
    });

    const addresses = data.itinerary.map(s => s.address);
    if (addresses.length >= 2) {
        const waypoints = addresses.slice(1, -1).map(addr => ({ location: addr, stopover: true }));
        directionsService.route({
            origin: addresses[0],
            destination: addresses[addresses.length - 1],
            waypoints: waypoints,
            travelMode: 'DRIVING'
        }, function(result, status) {
            if (status == 'OK') {
                directionsRenderer.setDirections(result);
                const route = result.routes[0];
                let locations = [route.legs[0].start_location];
                route.legs.forEach(leg => locations.push(leg.end_location));
                
                const markerBase = "http://maps.google.com/mapfiles/ms/icons/";
                locations.forEach((latLng, i) => {
                    const step = data.itinerary[i];
                    let iconUrl = markerBase + (i === 0 || i === locations.length-1 ? "red-dot.png" : 
                                  step.rating === 'great' ? "yellow-dot.png" : "blue-dot.png");
                    new google.maps.Marker({ position: latLng, map: map, icon: iconUrl, animation: google.maps.Animation.DROP });
                });
            }
        });
    }
}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=onGoogleMapsReady"></script>
{% endblock %}
